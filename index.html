<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1d45">
<title>방 채우기 대작전 - 모텔에서 호텔까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a4a;--cream:#fff8ec;--pink:#ff6f91;--pinkD:#d1456c;--green:#5fc27e;--greenD:#3c8f57;--gold:#ffc93c;--goldD:#d69a00;
  --brick:#d9a066;--wall:#fff3d6;--wall2:#f6e2b8;--blanket:#7cc46b;--awn1:#6dbb4d;--awn2:#fff8e0;--sign:#6dbb4d;--sky1:#20305e;--sky2:#4b5fa8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:#1c1430;font-family:'Jua',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);overflow:hidden;touch-action:manipulation}
body{background:radial-gradient(circle at 50% 20%,#3a2860,#160f27)}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.hf{font-family:'Black Han Sans','Jua',sans-serif;font-weight:normal}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 30%,#ffcf9e 100%);
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 0 40px rgba(0,0,0,.5)}

/* ---------- HUD ---------- */
#hud{display:flex;gap:6px;padding:8px 8px 0;align-items:center;position:relative;z-index:4}
.pill{background:var(--cream);border:3px solid var(--ink);border-radius:14px;height:36px;padding:0 8px;font-size:16px;box-shadow:0 3px 0 var(--ink);
  white-space:nowrap;display:flex;align-items:center;gap:5px;min-width:0;position:relative}
.pill .ic{width:24px;height:24px;flex:none;display:grid;place-items:center;font-size:18px}
#money{flex:1.5}
#money .ic{background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc93c 55%,#d69a00);border-radius:50%;border:2px solid #9a6b00;font-size:12px;color:#8a5a00}
#rep{flex:1}#dayP{flex:.9}
#money span,#rep span,#dayP span{overflow:hidden;text-overflow:ellipsis}
#muteBtn{background:var(--cream);border:3px solid var(--ink);border-radius:12px;width:36px;height:36px;font-size:16px;box-shadow:0 3px 0 var(--ink);flex:none}

/* ---------- scene (sky + skyline) ---------- */
#scene{position:relative;height:74px;margin-top:4px;flex:none;overflow:hidden}
#scene svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:60px}
#dawn{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(255,170,110,.85));opacity:0;transition:opacity .5s}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2s infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
#moon{position:absolute;top:4px;font-size:22px;transform:translateX(-50%);filter:drop-shadow(0 0 8px rgba(255,240,180,.8));transition:left .3s linear}
#clockPill{position:absolute;right:8px;top:6px;background:rgba(30,20,50,.65);color:#fff;border-radius:10px;padding:2px 8px;font-size:13px;white-space:nowrap;border:2px solid rgba(255,255,255,.25)}
#clockLine{position:absolute;left:8px;right:8px;top:30px;height:6px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
#clockFill{height:100%;width:0;background:linear-gradient(90deg,#9c8cff,#ffb36b);border-radius:4px}

/* ---------- building ---------- */
#building{flex:1;min-height:0;margin:-14px 8px 0;position:relative;display:flex;flex-direction:column;z-index:2}
#roof{position:relative;height:34px;flex:none;margin:0 -4px}
#awning{position:absolute;left:0;right:0;bottom:0;height:20px;border:3px solid var(--ink);border-radius:8px 8px 4px 4px;
  background:repeating-linear-gradient(90deg,var(--awn1) 0 24px,var(--awn2) 24px 48px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
#awning::after{content:'';position:absolute;left:-3px;right:-3px;bottom:-11px;height:10px;
  background:radial-gradient(circle at 12px 0,var(--awn1) 11px,transparent 12px) 0 0/48px 10px repeat-x,radial-gradient(circle at 36px 0,var(--awn2) 11px,transparent 12px) 0 0/48px 10px repeat-x}
#roof.flat #awning{background:linear-gradient(var(--awn1),var(--awn2));border-radius:6px}
#roof.flat #awning::after{display:none}
#sign{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:#2b1d3d;border:3px solid var(--ink);border-radius:14px;padding:3px 16px 4px;
  white-space:nowrap;z-index:3;box-shadow:0 0 0 2px var(--sign),0 0 18px var(--sign),0 3px 0 var(--ink);max-width:78%}
#signT{color:#fff;font-size:18px;text-shadow:0 0 6px var(--sign),0 0 12px var(--sign);display:block;overflow:hidden;text-overflow:ellipsis;animation:neon 4s infinite}
@keyframes neon{0%,40%,44%,48%,100%{opacity:1}42%,46%{opacity:.45}}
#combo{position:absolute;left:0;top:-32px;z-index:5;background:var(--gold);border:3px solid var(--ink);border-radius:12px;padding:0 7px;font-size:15px;color:var(--ink);
  box-shadow:0 3px 0 var(--ink);white-space:nowrap;display:none;transform:rotate(-5deg)}
#body{flex:1;min-height:0;position:relative;border:3px solid var(--ink);border-top:none;border-radius:0 0 10px 10px;margin-top:6px;
  background-color:var(--brick);background-image:linear-gradient(rgba(0,0,0,.09) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.07) 2px,transparent 2px);
  background-size:100% 16px,32px 16px;box-shadow:0 5px 0 rgba(0,0,0,.3);overflow:hidden}
#rooms{position:absolute;inset:0;display:grid;gap:8px;padding:12px 8px 8px;align-content:stretch}

/* room */
.room{position:relative;container-type:size;min-height:0;cursor:pointer}
.win{position:absolute;inset:0 0 14px 0;border:3px solid var(--ink);border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(90deg,var(--wall) 0 10px,var(--wall2) 10px 20px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6)}
.win::after{content:'';position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#c58f5e,#a8744a);border-top:2px solid rgba(0,0,0,.2)}
.plate{position:absolute;left:50%;top:-7px;transform:translateX(-50%);background:linear-gradient(#ffe38a,#e0a92b);border:2px solid var(--ink);border-radius:6px;
  font-size:10px;line-height:12px;padding:0 5px;z-index:3;white-space:nowrap;color:#5a3b00}
.lamp{position:absolute;right:8%;top:10%;width:18%;aspect-ratio:1;border-radius:50% 50% 10% 10%;background:#ffe9a8;border:2px solid var(--ink);z-index:1;opacity:.5}
.room.occ .lamp{opacity:1;box-shadow:0 0 14px 6px rgba(255,220,120,.7)}
.bedB,.bedF{position:absolute;left:6%;width:88%;bottom:4%;z-index:1}
.bedF{z-index:3;transition:transform .3s}
.who{position:absolute;left:8%;bottom:30%;z-index:2;font-size:min(34cqw,46cqh);line-height:1;transition:opacity .15s;display:none;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-2px) scale(1.03)}}
.room.occ .who,.room.rage .who,.room.hazG .who{display:block}
.room.dirty .bedF{transform:rotate(-8deg) translate(4%,-6%)}
.room.dirty .win{filter:saturate(.7) brightness(.92)}
.mess{position:absolute;inset:0;z-index:4;display:none;pointer-events:none}
.mess i{position:absolute;font-style:normal;font-size:16cqw}
.room.dirty .mess{display:block}
.fx{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:5;font-size:min(40cqw,52cqh);display:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.room.haz .fx,.room.rage .fx,.room.cleaning .fx{display:block}
.room.haz .fx{animation:wob .35s infinite}
.room.rage .fx{animation:wob .18s infinite;font-size:min(46cqw,58cqh)}
.room.fixing .fx{animation:spin 1s linear infinite}
.room.cleaning .fx{animation:scrub .5s infinite alternate}
@keyframes wob{0%,100%{transform:translate(-50%,-50%) rotate(-8deg)}50%{transform:translate(-50%,-50%) rotate(8deg) scale(1.08)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes scrub{from{transform:translate(-62%,-50%) rotate(-12deg)}to{transform:translate(-38%,-46%) rotate(12deg)}}
.room.haz .win{box-shadow:inset 0 0 0 3px #ff7a45,inset 0 0 22px rgba(255,90,40,.5)}
.room.rage .win{background:#ffb3b3;box-shadow:inset 0 0 0 3px #ff2d2d,inset 0 0 30px rgba(255,0,0,.55)}
.room.rage{animation:shake .2s infinite}
.room.cleaning .win{box-shadow:inset 0 0 0 3px #6bb6ff}
.room.free .win{box-shadow:inset 0 0 0 3px #8be08f}
.room.target .win{box-shadow:inset 0 0 0 4px var(--gold),0 0 0 3px var(--gold);animation:glow .8s infinite alternate}
@keyframes glow{to{box-shadow:inset 0 0 0 4px #fff2a8,0 0 0 4px #fff2a8,0 0 16px #ffe14d}}
.room.dark .win{filter:brightness(.3)}
.shine{position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.95) 45%,transparent 60%);transform:translateX(-120%)}
.room.shining .shine{animation:shine .6s ease-out}
@keyframes shine{to{transform:translateX(120%)}}
.vac{position:absolute;right:6%;top:8%;z-index:4;background:#3fb35f;color:#fff;font-size:min(11cqw,13px);border:2px solid var(--ink);border-radius:6px;padding:0 4px;white-space:nowrap;display:none;transform:rotate(6deg)}
.room.free .vac{display:block}
.lbl{position:absolute;left:50%;bottom:0;transform:translateX(-50%);background:var(--cream);border:2px solid var(--ink);border-radius:8px;padding:0 6px;
  font-size:clamp(9px,12cqw,12px);line-height:14px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;z-index:6}
.bar{position:absolute;left:10%;right:10%;bottom:18px;height:6px;background:rgba(0,0,0,.25);border-radius:4px;overflow:hidden;z-index:6;border:1px solid rgba(0,0,0,.3)}
.bar i{display:block;height:100%;width:0;background:#5fd38d}
.bub{position:absolute;top:-12px;right:-6px;background:#fff;border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:0 5px;font-size:20px;line-height:26px;
  display:none;z-index:7;white-space:nowrap;animation:bob .7s infinite alternate;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bub.urg{background:#ffe0e0;border-color:#e0425c}
@keyframes bob{to{transform:translateY(-4px) rotate(4deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px) rotate(-1deg)}75%{transform:translateX(2px) rotate(1deg)}}

/* ---------- clean minigame ---------- */
#cleanOv{position:absolute;inset:0;background:var(--cream);z-index:10;display:none;flex-direction:column;padding:8px;touch-action:none;border-radius:0 0 8px 8px}
#cleanOv.on{display:flex;animation:popIn .25s cubic-bezier(.3,1.6,.5,1)}
#cleanHead{display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap;margin-bottom:6px}
#cleanTitle{font-size:18px;overflow:hidden;text-overflow:ellipsis}
#cleanLeft{font-size:13px;background:var(--ink);color:#fff;border-radius:10px;padding:2px 8px;flex:none}
#cleanClose{background:#b9adc2;color:#fff;border:3px solid var(--ink);border-radius:10px;padding:2px 9px;font-size:13px;white-space:nowrap;box-shadow:0 3px 0 var(--ink);flex:none}
#floor{flex:1;min-height:0;position:relative;border-radius:12px;border:3px solid var(--ink);overflow:hidden;touch-action:none;
  background:repeating-linear-gradient(0deg,#e8b680 0 28px,#d9a167 28px 30px),#e8b680;box-shadow:inset 0 0 30px rgba(120,60,0,.25)}
#floor::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 90px,rgba(0,0,0,.06) 90px 92px)}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:transform .25s,opacity .25s}
.spot b{font-weight:normal;font-size:42px;line-height:1;animation:idle 1.4s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.spot:nth-child(2n) b{animation-delay:-.7s}
@keyframes idle{50%{transform:translateY(-3px) rotate(-4deg)}}
.spot span{font-size:11px;background:rgba(255,255,255,.92);border:2px solid var(--ink);border-radius:8px;padding:0 5px;white-space:nowrap;margin-top:2px}
.spot.done{transform:translate(-50%,-50%) scale(0) rotate(120deg);opacity:0}
.spot.no b{animation:shake .25s 2}
#tools{display:flex;gap:6px;margin-top:8px}
.tool{flex:1;min-width:0;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 var(--ink);touch-action:none;cursor:grab;transition:transform .1s}
.tool .te{font-size:28px;line-height:1.15}
.tool .tn{font-size:12px;white-space:nowrap}
.tool .tt{font-size:11px;white-space:nowrap;opacity:.85}
.tool.sel{background:#fff6c8;transform:translateY(-4px);box-shadow:0 8px 0 var(--ink)}
#cleanHint{font-size:12px;text-align:center;color:#8d7894;white-space:nowrap;margin-top:6px}
.ghost{position:absolute;left:0;top:0;font-size:48px;pointer-events:none;z-index:95;filter:drop-shadow(0 6px 2px rgba(0,0,0,.35));animation:ghostW .25s infinite alternate}
@keyframes ghostW{from{rotate:-18deg}to{rotate:8deg}}

/* ---------- desk ---------- */
#desk{margin:8px 8px 0;position:relative;z-index:3;flex:none}
#deskTop{height:14px;background:linear-gradient(#c98a55,#a86c3e);border:3px solid var(--ink);border-radius:8px 8px 0 0;border-bottom:none;position:relative}
#bell{position:absolute;right:10px;top:-16px;font-size:22px}
#deskBody{background:linear-gradient(#8a5a3b,#6d4630);border:3px solid var(--ink);border-top:2px solid rgba(0,0,0,.3);padding:5px 6px 7px}
#deskTitle{color:#ffe7c4;font-size:13px;margin:0 2px 4px;display:flex;justify-content:space-between;white-space:nowrap}
#queue{display:flex;gap:5px;height:78px}
.qslot{flex:1;min-width:0;background:rgba(0,0,0,.18);border-radius:10px;position:relative;border:2px dashed rgba(255,231,196,.25)}
.guest{position:absolute;inset:-2px;background:var(--cream);border:3px solid var(--ink);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 3px 0 var(--ink);animation:walkIn .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes walkIn{from{transform:translateX(60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.guest.sel{background:#fff6c8;transform:translateY(-6px);box-shadow:0 9px 0 var(--ink)}
.face{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pc,#5fd38d) calc(var(--p,1)*360deg),rgba(0,0,0,.12) 0)}
.face b{font-weight:normal;width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;line-height:1}
.guest .gn{font-size:10px;margin-top:1px;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
.guest .x{position:absolute;top:-9px;right:-7px;width:22px;height:22px;border-radius:50%;background:#ff5d6c;color:#fff;font-size:12px;line-height:17px;text-align:center;border:2px solid var(--ink)}
.guest.jerk{background:#ffe1e1}
.guest.jerk .face b{animation:wob2 .6s infinite}
@keyframes wob2{50%{transform:rotate(10deg)}}
.guest.vip{background:linear-gradient(#fff6c8,#ffe08a)}
.guest.vip::before{content:'👑';position:absolute;top:-12px;left:-4px;font-size:16px;transform:rotate(-20deg)}
.guest.hurry{animation:shake .3s infinite}

/* ---------- stock shelf ---------- */
#stock{display:flex;gap:5px;padding:6px 8px 9px;background:linear-gradient(#6d4630,#54341f);justify-content:center;border:3px solid var(--ink);border-top:none;margin:0 8px 6px;border-radius:0 0 10px 10px;flex:none}
.stk{background:var(--cream);border:2px solid var(--ink);border-radius:9px;padding:1px 7px;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:3px;box-shadow:0 2px 0 var(--ink)}
.stk.low{background:#ffcfcf;animation:shake .5s infinite}

/* ---------- fx layer ---------- */
.flt{position:absolute;left:0;top:0;pointer-events:none;font-size:18px;z-index:70;white-space:nowrap;font-family:'Black Han Sans','Jua',sans-serif;
  -webkit-text-stroke:0;text-shadow:2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff,2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 4px 0 rgba(0,0,0,.2)}
.fly,.pt{position:absolute;left:0;top:0;pointer-events:none;z-index:75;line-height:1;will-change:transform}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffc93c 55%,#c98a00);border:2px solid #8a5a00}
.ring{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #fff;pointer-events:none;z-index:96}
#flash{position:absolute;inset:0;pointer-events:none;z-index:85;opacity:0}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;z-index:88;pointer-events:none;display:none}
#banner .bt{display:inline-block;font-size:44px;color:#fff;padding:4px 24px;border-radius:18px;background:var(--pink);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);white-space:nowrap}
#banner .bs{font-size:16px;color:#fff;margin-top:10px;white-space:nowrap;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
#toast{position:absolute;left:50%;top:132px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:6px 14px;border-radius:999px;font-size:14px;z-index:90;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;border:2px solid rgba(255,255,255,.3)}
#toast.on{opacity:1;transform:translateX(-50%)}
#blackout{position:absolute;inset:0;background:rgba(10,5,25,.55);z-index:8;pointer-events:none;display:none;animation:flick .25s infinite}
@keyframes flick{50%{opacity:.75}}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;background:rgba(28,18,48,.72);display:none;align-items:center;justify-content:center;z-index:80;padding:14px;backdrop-filter:blur(2px)}
.ov.on{display:flex}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:14px 14px 16px;width:100%;max-height:100%;overflow:auto;box-shadow:0 7px 0 var(--ink);
  animation:popIn .32s cubic-bezier(.3,1.6,.5,1);position:relative}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.ribbon{margin:-14px -14px 10px;padding:10px 8px 8px;background:var(--pink);border-bottom:4px solid var(--ink);border-radius:17px 17px 0 0;text-align:center;color:#fff;
  font-size:22px;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ribbon.g{background:var(--green)}.ribbon.p{background:#8b6cff}.ribbon.o{background:#ff9a3d}
.card p{font-size:14px;line-height:1.5;color:#6b5470}
.btn{display:block;width:100%;background:var(--pink);color:#fff;font-size:19px;padding:10px;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);
  margin-top:12px;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.g{background:var(--green)}.btn.gray{background:#a99cb4}
.btn:disabled{background:#d3cad8;color:#f5f0f7}
.row{display:flex;justify-content:space-between;font-size:15px;padding:5px 4px;border-bottom:2px dashed #ead9c4;white-space:nowrap;gap:8px;opacity:0;animation:rowIn .3s forwards}
@keyframes rowIn{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
.plus{color:#2e9b55}.minus{color:#e0425c}
.net{font-size:20px;border:3px solid var(--ink);border-radius:12px;background:#fff;margin-top:6px;padding:6px 10px}
.rate{text-align:center;font-size:36px;letter-spacing:4px;margin:8px 0 2px}
.rate i{font-style:normal;display:inline-block;opacity:.2;filter:grayscale(1)}
.rate i.on{opacity:1;filter:none;animation:starPop .45s cubic-bezier(.3,1.8,.5,1) backwards}
@keyframes starPop{from{transform:scale(2.4) rotate(-40deg);opacity:0}}
.mood{text-align:center;font-size:15px;white-space:nowrap;margin-top:2px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tab{flex:1;background:#eadfd2;border:3px solid var(--ink);border-radius:12px;padding:5px 2px;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.tab.on{background:var(--pink);color:#fff;transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

function burst(p,{n=8,chars=null,colors=['#ffd84f','#ff6f91','#6bd3ff','#8be08f'],spread=60,dur=650,size=14,up=0}={}){
  for(let i=0;i<n;i++){

    app.appendChild(d);

    anim(d,[{transform:`translate(${p.x}px,${p.y}px) translate(-50%,-50%) scale(1) rotate(0)`,opacity:1},
      {transform:`translate(${p.x+dx}px,${p.y+dy}px) translate(-50%,-50%) scale(.9) rotate(${rnd(-180,180)}deg)`,opacity:1,offset:.6},
      {transform:`translate(${p.x+dx*1.1}px,${p.y+dy+24}px) translate(-50%,-50%) scale(.3)`,opacity:0}],{duration:dur*rnd(.8,1.2),easing:'cubic-bezier(.2,.8,.4,1)'});
    setTimeout(()=>d.remove(),dur*1.3);

function fly(content,from,to,{dur=520,arc=-70,size=26,cls='',delay=0,onEnd=null}={}){
  const d=document.createElement('div');d.className='fly '+cls;if(content)d.textContent=content;d.style.fontSize=size+'px';d.style.opacity='0';app.appendChild(d);

    const a=anim(d,[{transform:`translate(${from.x}px,${from.y}px) translate(-50%,-50%) scale(.8)`},
      {transform:`translate(${mx}px,${my}px) translate(-50%,-50%) scale(1.25)`,offset:.45},
      {transform:`translate(${to.x}px,${to.y}px) translate(-50%,-50%) scale(.7)`}],{duration:dur,easing:'cubic-bezier(.45,.05,.55,.95)',fill:'forwards'});
    const end=()=>{d.remove();onEnd&&onEnd();};
    if(a)a.onfinish=end;else setTimeout(end,dur);

}
function coinsTo(from,amount){

function update(dt){
  D.t+=dt;const st=stg();
  if(D.t<DAY_LEN){D.spawnT-=dt;if(D.spawnT<=0){spawnGuest();const mult=ADS[S.ad].mult*(.55+S.rep*.15);D.spawnT=st.spawn/mult*(.65+Math.random()*.7);}}
  if(D.blackout>0){D.blackout-=dt;if(D.blackout<=0)rooms.forEach(renderRoom);}
  $('blackout').style.display=D.blackout>0?'block':'none';
  const hz=st.haz*Math.pow(.8,fl('check'))*rooms.length;
  if(D.t<DAY_LEN&&Math.random()<hz*dt)triggerHazard();
  if(D.t<DAY_LEN&&S.stage>=2&&Math.random()<.0025*dt*S.stage&&D.blackout<=0)triggerBlackout();
  for(const g of queue.slice()){g.pat-=dt;if(g.pat<=0){const c=g.el?ctr(g.el):{x:100,y:500};removeGuest(g);addRep(-.06);D.lost++;toast('😠 기다리다 지친 손님이 떠났어요');snd('bad');floatAt(c,'흥! 😤','#e0425c',16);}}
  if(fl('staff')>0){D.staffT-=dt;if(D.staffT<=0){D.staffT=1.2;
    if(rooms.filter(r=>r.state==='cleaning'&&r.auto).length<fl('staff')){const d=rooms.find(r=>r.state==='dirty'&&!r.haz&&!r.inClean);if(d)startClean(d,true);}}}
  for(const r of rooms){
    if(D.blackout>0){renderRoom(r);continue;}
    if(r.haz){
      r.haz.t+=dt;
      if(r.haz.fixing){r.haz.fixT-=dt;if(r.haz.fixT<=0){r.haz=null;const c=ctr(r.win);floatAt(c,'수리 완료 🔧','#3d8bff',16);burst(c,{n:8,chars:['✨'],spread:40,size:12});snd('ok');}}
      else if(r.guest){r.sat-=dt*.05;
        if(r.haz.t>9){const c=ctr(r.win);floatAt(c,'환불해줘!! 💢','#e0425c',17);addRep(-.15);D.lost++;snd('bad');shake(4,200);
          fly(GUESTS[r.guest.type].e,c,{x:c.x+60,y:c.y-60},{size:30,dur:420,arc:-20});r.guest=null;r.req=null;r.state='dirty';r.mess=false;r.spots=null;}}
    }
    if(r.rage){
      r.rage.t-=dt;r.rage.puff=(r.rage.puff||0)-dt;
      if(r.rage.puff<=0){r.rage.puff=.45;const c=ctr(r.win);burst({x:c.x,y:c.y-c.h*.3},{n:2,chars:['💨','💢'],spread:24,size:13,up:-20,dur:500});}
      if(r.rage.t<=0){
        const loss=Math.max(Math.round(roomPrice()*2),Math.round((D.log.room||0)*.3)),c=ctr(r.win);
        addMoney(-loss,c,'jerk');addRep(-.3);D.jerkFail++;snd('thud');snd('bad');
        toast('💥 진상 난동! 기물파손·환불로 '+fmt(loss)+' 손해');
        flash('#ff2d2d',.5);shake(10,400);burst(c,{n:16,chars:['💥','🪑','💔','🍾'],spread:80,size:18});buzz(120);
        r.rage=null;r.guest=null;r.req=null;r.state='dirty';r.mess=true;r.spots=null;r.haz={type:'leak',taps:0,fixing:false,t:0};
      }
      renderRoom(r);continue;
    }
    if(r.state==='occ'){
      r.stay-=dt;
      if(r.jerkT>0){r.jerkT-=dt;if(r.jerkT<=0&&Math.random()<.85){
        const need=Math.max(5,Math.round((9+S.stage)*Math.pow(.75,fl('cctv'))));
        r.rage={t:5.5,taps:0,need};snd('alarm');shake(5,250);flash('#ff2d2d',.25);toast('🤬 '+r.num+'호 진상 난동! 연타해서 말려요!');buzz(60);}}
      if(r.req){r.req.t-=dt;if(r.req.t<=0){r.req=null;r.sat-=.25;floatAt(ctr(r.win),'서비스 엉망! 👎','#e0425c',14);addRep(-.03);r.reqCd=5;snd('bad');}}
      else if(!r.haz){r.reqCd-=dt;if(r.reqCd<=0){const T=GUESTS[r.guest.type];
        if(Math.random()<T.req*.6){const its=st.items;r.req={item:its[Math.floor(Math.random()*its.length)],t:7};snd('pop');}r.reqCd=3+Math.random()*4;}}
      if(r.stay<=0)checkOut(r);
    }else if(r.state==='cleaning'){
      r.cleanT-=dt;if(r.cleanT<=0){r.state='free';r.auto=false;r.mess=false;r.spots=null;r.shineT=performance.now()+650;const c=ctr(r.win);floatAt(c,'반짝반짝✨','#3d8bff',15);burst(c,{n:8,chars:['✨','🫧'],spread:40,size:12});}
    }
    renderRoom(r);
  }
  if(combo>0&&performance.now()-lastAct>2600){combo=0;$('combo').style.display='none';}
  // sky clock
  const p=Math.min(1,D.t/DAY_LEN);
  $('clockFill').style.width=(p*100)+'%';$('dawn').style.opacity=Math.max(0,(p-.55)/.45).toFixed(3);
  $('moon').style.left=(6+p*70)+'%';setT($('moon'),p>.8?'🌤️':'🌙');
  const mins=20*60+p*15*60,hh=Math.floor(mins/60)%24,mm=Math.floor(mins%60/10)*10;
  setT($('clockPill'),p>=1?'영업 종료!':`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} ${hh>=20||hh<4?'🌙':'🌅'}`);
  renderQueue();
  if(D.t>=DAY_LEN){
    if(!D.ending){D.ending=true;closeClean();
      for(const g of queue.slice())removeGuest(g);
      for(const r of rooms){if(r.rage)r.rage=null;if(r.state==='occ')checkOut(r,true);}
      banner('CLOSED','🌅 오늘 영업 끝!','#8b6cff');snd('fanfare');}
    if(D.t>=DAY_LEN+1.8)endDay();
  }
}
function loop(t){

  dispMoney+=(S.money-dispMoney)*Math.min(1,dt*7);if(Math.abs(S.money-dispMoney)<.5)dispMoney=S.money;
  renderHud();
  requestAnimationFrame(loop);
}

// ======================= CLEAN MINIGAME =======================
let cleanRoom=null,selTool=null,drag=null,cleanLock=false;
const cleanOv=$('cleanOv'),floorEl=$('floor'),toolsEl=$('tools');
function genSpots(r){
  let n=(r.mess?5:3)-(fl('mop')>=2?1:0)-(fl('mop')>=4?1:0);n=Math.max(2,n);
  const pool=r.mess?['dust','confetti','confetti','stain','puddle','can','bottle','bottle']:['dust','dust','stain','puddle','can','bottle'];
  const kinds=['bed'];while(kinds.length<n)kinds.push(pool[Math.floor(Math.random()*pool.length)]);
  const cells=[0,1,2,3,4,5,6,7,8].sort(()=>Math.random()-.5);
  r.spots=kinds.map((k,i)=>{const c=cells[i];return{k,done:false,x:(c%3+.5)/3*100+(Math.random()-.5)*12,y:(Math.floor(c/3)+.5)/3*100+(Math.random()-.5)*10};});
}
function openClean(r){
  if(cleanRoom&&cleanRoom!==r)cleanRoom.inClean=false;
  cleanRoom=r;r.inClean=true;cleanLock=false;if(!r.spots)genSpots(r);
  floorEl.innerHTML='';
  r.spots.forEach(sp=>{const M=MESS[sp.k],el=document.createElement('div');el.className='spot'+(sp.done?' done':'');
    el.innerHTML=`<b>${M.e}</b><span>${M.n}</span>`;el.style.left=sp.x+'%';el.style.top=Math.max(14,Math.min(86,sp.y))+'%';sp.el=el;floorEl.appendChild(el);});
  if(!toolsEl.childElementCount){
    for(const k in TOOLS){const T=TOOLS[k],el=document.createElement('div');el.className='tool';el.dataset.k=k;
      const tg=Object.values(MESS).filter(m=>m.tool===k).map(m=>m.e).join('');
      el.innerHTML=`<div class="te">${T.e}</div><div class="tn">${T.n}</div><div class="tt">${tg}</div>`;
      el.addEventListener('pointerdown',e=>{e.preventDefault();selTool=k;renderTools();startDrag(e);});
      toolsEl.appendChild(el);}
  }
  renderTools();updateCleanHead();cleanOv.classList.add('on');renderRoom(r);
}
function closeClean(){
  if(drag){drag.ghost.remove();drag=null;}
  if(cleanRoom){const r=cleanRoom;cleanRoom.inClean=false;cleanRoom=null;renderRoom(r);}
  cleanOv.classList.remove('on');
}
function renderTools(){for(const el of toolsEl.children)el.classList.toggle('sel',el.dataset.k===selTool);}
function updateCleanHead(){const r=cleanRoom;if(!r)return;setT($('cleanTitle'),`🧹 ${r.num}호 ${r.mess?'난장판 ':''}청소`);setT($('cleanLeft'),`남은 곳 ${r.spots.filter(x=>!x.done).length}`);}
function startDrag(e){
  if(cleanLock)return;
  if(!selTool){toast('아래에서 청소 도구를 먼저 골라요');snd('bad');anim(toolsEl,[{transform:'translateY(0)'},{transform:'translateY(-6px)'},{transform:'none'}],{duration:250});return;}
  const g=document.createElement('div');g.className='ghost';g.textContent=TOOLS[selTool].e;app.appendChild(g);
  drag={ghost:g,lx:0,ly:0,trail:0};moveDrag(e.clientX,e.clientY);snd('tap');
}
function moveDrag(x,y){
  if(!drag)return;const a=app.getBoundingClientRect(),px=x-a.left,py=y-a.top;
  drag.ghost.style.transform=`translate(${px}px,${py}px) translate(-50%,-70%)`;
  const dist=Math.hypot(px-drag.lx,py-drag.ly);
  if(dist>14&&cleanRoom){drag.lx=px;drag.ly=py;drag.trail++;
    const d=document.createElement('div');d.className='pt';const s=rnd(5,10);d.style.width=d.style.height=s+'px';d.style.borderRadius='50%';d.style.background=TOOLS[selTool].trail;d.style.border='1px solid rgba(0,0,0,.15)';
    app.appendChild(d);anim(d,[{transform:`translate(${px+rnd(-8,8)}px,${py+10}px) scale(1)`,opacity:.9},{transform:`translate(${px+rnd(-20,20)}px,${py+rnd(0,30)}px) scale(.2)`,opacity:0}],{duration:450});setTimeout(()=>d.remove(),460);
    if(drag.trail%4===0)snd('swish');}
  scrub(x,y);
}
function scrub(x,y){
  const r=cleanRoom;if(!r||!r.spots||cleanLock)return;
  const rad=16+8*fl('mop');
  for(const sp of r.spots){
    if(sp.done||!sp.el)continue;
    const b=sp.el.getBoundingClientRect();if(Math.hypot(x-(b.left+b.width/2),y-(b.top+b.height/2))>b.width/2+rad)continue;
    const c=ctr(sp.el);
    if(MESS[sp.k].tool===selTool){
      sp.done=true;sp.el.classList.add('done');snd('pop');snd('sparkle');hit();buzz(15);
      burst(c,{n:10,chars:sp.k==='bed'?['✨','⭐']:['🫧','✨'],spread:50,size:15});floatAt(c,['깨끗!','반짝!','좋아!','완벽!'][Math.floor(Math.random()*4)],'#3d8bff',17);
      updateCleanHead();renderRoom(r);
      if(r.spots.every(q=>q.done)){cleanLock=true;setTimeout(()=>finishClean(r),380);}
      return;
    }else{
      const now=performance.now();
      if(!sp.warn||now-sp.warn>700){sp.warn=now;sp.el.classList.remove('no');void sp.el.offsetWidth;sp.el.classList.add('no');floatAt(c,TOOLS[MESS[sp.k].tool].e+' 필요!','#e0425c',15);snd('bad');}
    }
  }
}
function finishClean(r){
  closeClean();
  r.state='free';r.mess=false;r.spots=null;r.shineT=performance.now()+650;
  const c=ctr(r.win);floatAt(c,'반짝반짝✨','#3d8bff',18);burst(c,{n:14,chars:['✨','⭐','🫧'],spread:60,size:15});snd('fanfare');addRep(.01);squash(r.el,1);renderSel();
}
floorEl.addEventListener('pointerdown',e=>{e.preventDefault();startDrag(e);});
window.addEventListener('pointermove',e=>{if(drag){e.preventDefault();moveDrag(e.clientX,e.clientY);}},{passive:false});
function endDrag(e){if(!drag)return;scrub(e.clientX,e.clientY);if(drag){drag.ghost.remove();drag=null;}}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
$('cleanClose').addEventListener('click',()=>{closeClean();});

  $('ovReport').classList.remove('on');
  if(S.money<-300){showMsg('💸','파산했어요…','빚이 너무 많아요. 이번 지역에서 다시 시작합니다. (자금 300으로 재출발)',()=>{S.money=300;dispMoney=300;S.rep=Math.max(2.5,S.rep);S.roomsOwned=stg().rooms;save();openShop();});return;}
  setT($('shopTitle'),`🌙 ${S.day}일차 준비 · ${stg().name}`);$('ovShop').classList.add('on');renderShop();
}
function lvDots(lv,max){let s='<span class="lv">';for(let i=0;i<max;i++)s+=`<i class="${i<lv?'on':''}"></i>`;return s+'</span>';}
function renderShop(){
  $('shopMoney').innerHTML=`<div class="pill"><span class="ic hf" style="background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc93c 55%,#d69a00);border-radius:50%;border:2px solid #9a6b00;font-size:12px;color:#8a5a00">₩</span>${fmt(S.money)}</div><div class="pill">⭐ ${S.rep.toFixed(1)}</div>`;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===shopTab));
  const st=stg();let h='';
  if(shopTab==='order'){
    h+=`<p style="font-size:12px;margin-bottom:6px;white-space:nowrap">손님 요청에 판매할 비품을 발주해요 (10개 단위)</p>`;
    for(const k of st.items){const I=ITEMS[k],c=I.cost*10;
      h+=`<div class="item"><div class="ie">${I.e}</div><div class="it"><div class="t1">${I.n} · 재고 ${S.stock[k]||0}</div><div class="t2">원가 ${I.cost} → 판매 ${I.sell}</div></div><button class="sbtn" data-buy="${k}" ${S.money<c?'disabled':''}>+10 · ${fmt(c)}</button></div>`;}
  }else if(shopTab==='ad'){
    h+=`<p style="font-size:12px;margin-bottom:6px;white-space:nowrap">광고는 매일 아침 비용이 나가고 손님이 늘어요</p>`;
    ADS.forEach((a,i)=>{const lock=a.st>S.stage;
      h+=`<div class="item"><div class="ie">${lock?'🔒':a.e}</div><div class="it"><div class="t1">${a.n}</div><div class="t2">${lock?STAGES[a.st].name+' 이상':'하루 '+fmt(a.cost)+' · 손님 x'+a.mult}</div></div><button class="sbtn ${S.ad===i?'on':''}" data-ad="${i}" ${lock?'disabled':''}>${S.ad===i?'사용중':'선택'}</button></div>`;});
  }else if(shopTab==='fac'){
    const rc=roomCost(),mx=S.roomsOwned>=st.maxRooms;
    h+=`<div class="item"><div class="ie">🚪</div><div class="it"><div class="t1">객실 증축 · ${S.roomsOwned}/${st.maxRooms}실</div><div class="t2">손님을 더 많이 받아요</div></div><button class="sbtn" data-room="1" ${mx||S.money<rc?'disabled':''}>${mx?'최대':fmt(rc)}</button></div>`;
    for(const f of FAC){const lv=fl(f.id),c=facCost(f),m=lv>=f.max;
      h+=`<div class="item"><div class="ie">${f.e}</div><div class="it"><div class="t1">${f.n}${lvDots(lv,f.max)}</div><div class="t2">${f.d}${f.daily?' · 일급':''}</div></div><button class="sbtn" data-fac="${f.id}" ${m||S.money<c?'disabled':''}>${m?'MAX':fmt(c)}</button></div>`;}
  }else{
    h+=`<div class="mapline">${STAGES.map((s,i)=>`<span class="${i<=S.stage?'done':''} ${i===S.stage?'cur':''}">${s.emoji}</span>`).join('<em>▸</em>')}</div>`;
    const nx=STAGES[S.stage+1];
    if(!nx)h+=`<p style="text-align:center">🏆 세계 최고의 호텔 도달!<br>계속 운영하며 기록에 도전하세요.</p>`;
    else{const okR=S.rep>=nx.rep,okM=S.money>=nx.cost;
      h+=`<div class="item"><div class="ie">${nx.emoji}</div><div class="it"><div class="t1">${nx.name}</div><div class="t2">${nx.where} · 객실 ${nx.rooms}실부터</div></div></div>`;
      h+=`<p style="font-size:13px;margin:2px 2px 4px">${nx.intro}</p>`;
      h+=`<div class="row" style="opacity:1;animation:none"><span>⭐ 평판 ${nx.rep.toFixed(1)} 이상</span><b class="${okR?'plus':'minus'}">${okR?'✔ 달성':'현재 '+S.rep.toFixed(1)}</b></div>`;
      h+=`<div class="row" style="opacity:1;animation:none"><span>💰 이전 비용 ${fmt(nx.cost)}</span><b class="${okM?'plus':'minus'}">${okM?'✔ 충분':'부족'}</b></div>`;
      h+=`<button class="btn g" data-promo="1" ${okR&&okM?'':'disabled'}>🚚 ${nx.name}(으)로 이전!</button>`;}
  }
  $('shopBody').innerHTML=h;
}
function roomCost(){return Math.round(stg().price*12*Math.pow(1.35,S.roomsOwned-stg().rooms));}
function facCost(f){return Math.round(f.base*Math.pow(f.grow,fl(f.id))*(1+S.stage*.6));}
function spendFx(btn,c){const p=ctr(btn);floatAt(p,'-'+fmt(c),'#e0425c',17);burst(p,{n:6,colors:['#ffd84f','#ffb300'],spread:30,size:10});snd('coin');}
$('shopBody').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.buy){const k=b.dataset.buy,c=ITEMS[k].cost*10;if(S.money>=c){S.money-=c;S.stock[k]=(S.stock[k]||0)+10;spendFx(b,c);fly(ITEMS[k].e,ctr(b),ctr($('shopMoney')),{size:26,dur:400,arc:-40});}}
  else if(b.dataset.ad){S.ad=+b.dataset.ad;snd('ok');}
  else if(b.dataset.room){const c=roomCost();if(S.money>=c){S.money-=c;S.roomsOwned++;spendFx(b,c);snd('fanfare');}}
  else if(b.dataset.fac){const f=FAC.find(x=>x.id===b.dataset.fac),c=facCost(f);if(S.money>=c&&fl(f.id)<f.max){S.money-=c;S.fac[f.id]=fl(f.id)+1;spendFx(b,c);snd('sparkle');}}
  else if(b.dataset.promo){promote();return;}
  save();renderShop();
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{shopTab=t.dataset.t;renderShop();anim($('shopBody'),[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:180});}));
function promote(){
  const nx=STAGES[S.stage+1];if(!nx)return;
  S.money-=nx.cost;S.stage++;S.roomsOwned=nx.rooms;S.rep=Math.max(3,S.rep-.4);
  for(const k of nx.items)if(S.stock[k]==null)S.stock[k]=10;
  if(ADS[S.ad].st>S.stage)S.ad=0;
  save();$('ovShop').classList.remove('on');
  showMsg(nx.emoji,`${nx.name} 오픈!`,`${nx.where}(으)로 이사했어요. ${nx.intro} (새 동네라 평판이 조금 내려가요)`,()=>{applyTheme();openShop();},true);
}
function showMsg(big,title,body,cb,truck){
  setT($('msgBig'),big);setT($('msgTitle'),title);$('msgBody').textContent=body;$('ovMsg').classList.add('on');
  const road=$('truckRoad');road.style.display=truck?'block':'none';
  if(truck){$('msgBig').style.visibility='hidden';snd('thud');
    anim($('truck'),[{left:'-70px'},{left:'calc(100% + 20px)'}],{duration:1300,easing:'ease-in-out',fill:'forwards'});
    setTimeout(()=>{$('msgBig').style.visibility='visible';popEl($('msgBig'),1.5);snd('fanfare');const c=ctr($('msgBig'));burst(c,{n:18,spread:90,size:12});burst(c,{n:8,chars:['🎉','✨'],spread:70,size:18});},1150);}
  else{$('msgBig').style.visibility='visible';popEl($('msgBig'),1.3);}
  $('btnMsg').onclick=()=>{$('ovMsg').classList.remove('on');cb&&cb();};
}
$('btnToShop').onclick=()=>openShop();
$('btnNextDay').onclick=()=>{$('ovShop').classList.remove('on');startDay();};
$('btnStart').onclick=()=>{
  A();$('ovTitle').classList.remove('on');
  if(S.day===1&&S.stage===0)showMsg('🌾','시골 모텔 오픈!',STAGES[0].intro+' 하루는 약 70초예요.',startDay);
  else openShop();
};
$('btnReset').onclick=()=>{S=fresh();dispMoney=S.money;save();applyTheme();buildRooms();$('btnReset').style.display='none';setT($('btnStart'),'영업 시작!');};
$('muteBtn').onclick=()=>{S.muted=!S.muted;setT($('muteBtn'),S.muted?'🔇':'🔊');save();};
$('desk').addEventListener('pointerdown',e=>{if(e.target.closest('.guest'))return;if(selGuest){selGuest=null;renderSel();}});

// title letters hop
$('titleT').innerHTML=[...'방 채우기 대작전'].map((ch,i)=>ch===' '?' ':`<span style="animation-delay:${i*.09}s">${ch}</span>`).join('');

// init
applyTheme();renderStock();setT($('muteBtn'),S.muted?'🔇':'🔊');
if(S.day>1||S.stage>0){setT($('btnStart'),`이어하기 (${STAGES[S.stage].name} ${S.day}일차)`);$('btnReset').style.display='block';}
buildRooms();buildQueue();rooms.forEach(renderRoom);
requestAnimationFrame(loop);
window.__G={get S(){return S},get rooms(){return rooms},get queue(){return queue},tapRoom:i=>tapRoom(rooms[i]),endDayNow:()=>{if(D)D.t=DAY_LEN+2;},
  cleanNow:()=>{const r=cleanRoom;if(!r)return;for(const sp of r.spots){if(!sp.done){selTool=MESS[sp.k].tool;const b=sp.el.getBoundingClientRect();scrub(b.left+b.width/2,b.top+b.height/2);}if(cleanLock)break;}},get cleanRoom(){return cleanRoom}};
})();
</script>
</body>
